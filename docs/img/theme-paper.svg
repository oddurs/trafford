<text y="115.5"><tspan x="16.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan><tspan x="25.5" textLength="18.0" lengthAdjust="spacingAndGlyphs" fill="#a8621b" xml:space="preserve">▾ </tspan><tspan x="43.5" textLength="81.0" lengthAdjust="spacingAndGlyphs" fill="#a8621b" xml:space="preserve" font-weight="700">Deep work</tspan><tspan x="664.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#a8621b" xml:space="preserve">▐</tspan><tspan x="673.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan></text>
<text y="137.2"><tspan x="16.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan><tspan x="664.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#a8621b" xml:space="preserve">▐</tspan><tspan x="673.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan></text>
<text y="159.0"><tspan x="16.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan><tspan x="25.5" textLength="639.0" lengthAdjust="spacingAndGlyphs" fill="#2e2a24" xml:space="preserve">Notes from a long read, kept as reference rather than as prose. A      </tspan><tspan x="673.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan></text>
<text y="180.8"><tspan x="16.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan><tspan x="25.5" textLength="639.0" lengthAdjust="spacingAndGlyphs" fill="#2e2a24" xml:space="preserve">heading every few lines, which is what reference material looks like   </tspan><tspan x="673.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan></text>
<text y="202.5"><tspan x="16.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan><tspan x="25.5" textLength="639.0" lengthAdjust="spacingAndGlyphs" fill="#2e2a24" xml:space="preserve">once it is written down rather than imagined.                          </tspan><tspan x="673.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan></text>
<text y="224.2"><tspan x="16.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan><tspan x="673.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan></text>
<text y="246.0"><tspan x="16.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan><tspan x="25.5" textLength="18.0" lengthAdjust="spacingAndGlyphs" fill="#a8621b" xml:space="preserve">▾ </tspan><tspan x="43.5" textLength="99.0" lengthAdjust="spacingAndGlyphs" fill="#181511" xml:space="preserve" font-weight="700">The premise</tspan><tspan x="673.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan></text>
<text y="267.8"><tspan x="16.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan><tspan x="673.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan></text>
<text y="289.5"><tspan x="16.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan><tspan x="25.5" textLength="639.0" lengthAdjust="spacingAndGlyphs" fill="#2e2a24" xml:space="preserve">The ability to concentrate without distraction on a demanding task is  </tspan><tspan x="673.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan></text>
<text y="311.2"><tspan x="16.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan><tspan x="25.5" textLength="639.0" lengthAdjust="spacingAndGlyphs" fill="#2e2a24" xml:space="preserve">becoming rare at the same time as it is becoming valuable. Those two   </tspan><tspan x="673.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan></text>
<text y="333.0"><tspan x="16.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan><tspan x="25.5" textLength="639.0" lengthAdjust="spacingAndGlyphs" fill="#2e2a24" xml:space="preserve">trends together are the whole argument.                                </tspan><tspan x="673.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan></text>
<text y="354.8"><tspan x="16.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan><tspan x="673.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan></text>
<text y="376.5"><tspan x="16.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan><tspan x="25.5" textLength="639.0" lengthAdjust="spacingAndGlyphs" fill="#2e2a24" xml:space="preserve">Shallow work is not useless — it is the logistics of a job. The claim  </tspan><tspan x="673.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan></text>
<text y="398.2"><tspan x="16.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan><tspan x="25.5" textLength="639.0" lengthAdjust="spacingAndGlyphs" fill="#2e2a24" xml:space="preserve">is only that it does not compound, and that a career built entirely    </tspan><tspan x="673.5" textLength="9.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">│</tspan></text>
<text y="420.0"><tspan x="16.5" textLength="666.0" lengthAdjust="spacingAndGlyphs" fill="#9a8f7c" xml:space="preserve">╰────────────────────────────────────────────────────────────────────────╯</tspan></text>
