name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast and independent of the toolchain, so it fails in seconds rather than
  # after a cargo build. The guard it tests is what keeps an agent from
  # destroying work, and it has already failed silently once.
  hooks:
    name: git guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the git guard
        run: ./.claude/hooks/git-guard.test.sh

  check:
    name: fmt · clippy · test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      # Formatting first: it is the cheapest failure to produce and to fix.
      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      # A release build catches the lto/codegen settings actually compiling.
      - name: Release build
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --release
