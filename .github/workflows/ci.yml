name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays, early. Only the external-link job runs on this trigger.
    - cron: "17 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast and independent of the toolchain, so it fails in seconds rather than
  # after a cargo build. The guard it tests is what keeps an agent from
  # destroying work, and it has already failed silently once.
  hooks:
    name: git guard
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the git guard
        run: ./.claude/hooks/git-guard.test.sh

  check:
    name: fmt · clippy · test
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      # Formatting first: it is the cheapest failure to produce and to fix.
      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      # A release build catches the lto/codegen settings actually compiling.
      - name: Release build
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --release

  # The site rots in ways the compiler cannot see: a link to a renamed page, a
  # screenshot of an interface that changed, a keymap page that no longer
  # matches the keymap. Held to the same standard as the crate, and kept
  # independent of the `check` job so a formatting failure and a broken link
  # are reported together rather than one after the other.
  site:
    name: docs site
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: site-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: site-cargo-

      # The whole enforcement for anything generated: regenerate, and diff.
      - name: The keymap page is current
        run: |
          cargo run -p trafford-site -- sync
          git diff --exit-code docs/keys.md \
            || { echo '::error::run `site sync` and commit docs/keys.md'; exit 1; }

      - name: Build the release binary the screenshots are taken with
        run: cargo build --release -p trafford

      - name: The screenshots match what trafford draws
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pyte
          .venv/bin/python tools/shots.py --check

      # Broken internal links, missing anchors and links into a renamed type
      # all fail the build itself. This is where that is enforced on a branch
      # nobody ran locally.
      - name: Build the site, with rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo run -p trafford-site -- build --api

      # Builds it, serves it, and asks for every page. A server per test, on a
      # port nobody named, so they run in parallel.
      - name: Serve it and hit every page
        run: cargo test -p trafford-site

  # External links fail for reasons that have nothing to do with the change
  # under review, and breaking someone's pull request on a third party's
  # expired certificate is how link checking gets switched off. Weekly, on its
  # own, opening an issue rather than failing a build.
  external-links:
    name: external links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - run: cargo run -p trafford-site -- build
      - id: check
        run: python3 tools/linkcheck.py target/site
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "External links are failing" \
            --body "The weekly link check found unreachable links. See the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label docs
