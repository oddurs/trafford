[package]
name = "trafford"
version = "0.1.0"
edition = "2021"
description = "A terminal knowledge base — Obsidian-style vault, modal editing, git, and an LLM that reads your notes."
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
ignore = "0.4"
unicode-width = "0.2"
unicode-segmentation = "1"
chrono = "0.4"
ureq = { version = "2", features = ["json", "tls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
